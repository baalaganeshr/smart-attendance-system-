{% extends 'base.html' %}

{% block title %}Edit Company{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
  <h1 class="h2"><i class="bi bi-building"></i> Edit Company</h1>
  <a href="{% url 'attendance:manage_companies' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Companies</a>
</div>

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header"><h5 class="mb-0">Edit Company: {{ company.name }}</h5></div>
      <div class="card-body">
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input type="text" name="name" class="form-control" value="{{ company.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Address</label>
            <textarea name="address" class="form-control" rows="2">{{ company.address|default:'' }}</textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control" value="{{ company.phone|default:'' }}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ company.email|default:'' }}">
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Latitude</label>
              <input type="text" name="lat" class="form-control" value="{{ company.lat }}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Longitude</label>
              <input type="text" name="lon" class="form-control" value="{{ company.lon }}" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Radius (m)</label>
            <input type="number" step="1" name="radius" class="form-control" value="{{ company.radius }}" required>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check"></i> Update Company</button>
            <a href="{% url 'attendance:manage_companies' %}" class="btn btn-secondary"><i class="bi bi-x"></i> Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
